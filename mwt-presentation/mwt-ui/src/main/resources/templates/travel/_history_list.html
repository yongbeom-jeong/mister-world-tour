<!--/* 이전 여행 이력 팝업 내용 (UC3) */-->
<div th:if="${!histories.isEmpty()}" class="list-group list-group-flush" xmlns:th="http://www.thymeleaf.org">
  <div th:each="h : ${histories}" class="list-group-item px-0 py-3 d-flex gap-3 align-items-center">
    <div class="stat-icon"><i class="bi bi-airplane"></i></div>
    <div class="flex-grow-1">
      <div class="fw-semibold" th:text="${h.productName}">상품</div>
      <div class="small text-muted"><th:block th:text="|${h.travelPeriod}일 · ${h.tourLevel.label} ·|">기간</th:block>
        <th:block th:if="${h.completed}" th:text="|${@mwt.date(h.completedAt, 'yyyy-MM-dd')} 완료|">완료</th:block>
        <span th:unless="${h.completed}" class="tag tag-muted">미완료</span></div>
    </div>
    <div class="fw-bold text-end" th:text="${@mwt.won(h.price)}">0원</div>
  </div>
</div>
<div th:if="${histories.isEmpty()}" class="text-center py-4" xmlns:th="http://www.thymeleaf.org">
  <i class="bi bi-compass fs-1 text-muted"></i>
  <p class="text-muted mt-2 mb-0">이전 여행 이력이 없습니다. 첫 여행을 떠나 보세요!</p>
</div>
