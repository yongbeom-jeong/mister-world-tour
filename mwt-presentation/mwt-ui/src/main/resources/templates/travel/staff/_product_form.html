<!--/*
  상품 등록·수정 공통 입력 + 사진 + 기본 구성 확인.
  사용: <form enctype="multipart/form-data"> 안에서 <th:block th:replace="~{travel/staff/_product_form :: fields(${photo}, ${hasImage})}">
  모델: form(ProductForm), errors(항목별 오류), themes, levels, minDate
*/-->
<th:block th:fragment="fields(photo, hasImage)" xmlns:th="http://www.thymeleaf.org">
<!--/* 출발일 달력 (flatpickr) */-->
<link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ko.js"></script>
<div class="row g-4">
  <div class="col-xl-7">
    <div class="row">
      <div class="col-md-8 mb-3">
        <label class="form-label" for="id_name">상품 이름 <span class="text-danger">*</span></label>
        <input type="text" name="name" id="id_name" maxlength="100" th:value="${form.name}"
               th:class="|form-control ${errors.get('name') != null ? 'is-invalid' : ''}|">
        <div th:if="${errors.get('name') != null}" class="invalid-feedback d-block" th:text="${errors.get('name')}">오류</div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="id_destination">여행지 <span class="text-danger">*</span></label>
        <input type="text" name="destination" id="id_destination" maxlength="100" th:value="${form.destination}"
               th:class="|form-control ${errors.get('destination') != null ? 'is-invalid' : ''}|">
        <div th:if="${errors.get('destination') != null}" class="invalid-feedback d-block" th:text="${errors.get('destination')}">오류</div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="id_theme">테마 <span class="text-danger">*</span></label>
        <select name="theme" id="id_theme" th:class="|form-select ${errors.get('theme') != null ? 'is-invalid' : ''}|">
          <option value="">테마를 고르세요</option>
          <option th:each="t : ${themes}" th:value="${t.name()}" th:text="${t.label}" th:selected="${form.theme == t.name()}">테마</option>
        </select>
        <div th:if="${errors.get('theme') != null}" class="invalid-feedback d-block" th:text="${errors.get('theme')}">오류</div>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="id_tour_level">초기 등급 <span class="text-danger">*</span></label>
        <select name="tourLevel" id="id_tour_level" th:class="|form-select ${errors.get('tour_level') != null ? 'is-invalid' : ''}|">
          <option value="">등급을 고르세요</option>
          <option th:each="lv : ${levels}" th:value="${lv.name()}" th:text="${lv.label}" th:selected="${form.tourLevel == lv.name()}">등급</option>
        </select>
        <div th:if="${errors.get('tour_level') != null}" class="invalid-feedback d-block" th:text="${errors.get('tour_level')}">오류</div>
        <div class="form-text">허니문·효도는 그랜드 또는 프리미엄만 가능</div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="id_base_price">1인 기본 가격(원) <span class="text-danger">*</span></label>
        <input type="number" name="basePrice" id="id_base_price" min="0" th:value="${form.basePrice}"
               th:class="|form-control ${errors.get('base_price') != null ? 'is-invalid' : ''}|">
        <div th:if="${errors.get('base_price') != null}" class="invalid-feedback d-block" th:text="${errors.get('base_price')}">오류</div>
        <div class="form-text">1인 기준, 10,000~50,000,000원</div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="id_travel_days">여행 기간(일) <span class="text-danger">*</span></label>
        <input type="number" name="travelDays" id="id_travel_days" min="0" th:value="${form.travelDays}"
               th:class="|form-control ${errors.get('travel_days') != null ? 'is-invalid' : ''}|">
        <div th:if="${errors.get('travel_days') != null}" class="invalid-feedback d-block" th:text="${errors.get('travel_days')}">오류</div>
        <div class="form-text">1~30일</div>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label" for="id_departure_date">출발일 <span class="text-danger">*</span></label>
        <input type="date" name="departureDate" id="id_departure_date" th:value="${form.departureDate}" th:min="${minDate}"
               th:class="|form-control ${errors.get('departure_date') != null ? 'is-invalid' : ''}|">
        <div th:if="${errors.get('departure_date') != null}" class="invalid-feedback d-block" th:text="${errors.get('departure_date')}">오류</div>
        <div class="form-text">내일 이후 날짜</div>
      </div>
      <div class="col-12 mb-3">
        <label class="form-label" for="id_description">상품 소개</label>
        <textarea name="description" id="id_description" rows="3" class="form-control" th:text="${form.description}"></textarea>
      </div>
    </div>
  </div>

  <div class="col-xl-5">
    <div class="mb-3">
      <div class="form-label">대표 사진</div>
      <div class="rounded-3 overflow-hidden mb-2 position-relative" style="aspect-ratio:16/10;background:var(--mwt-surface)">
        <img id="photo-preview" class="w-100 h-100" style="object-fit:cover" th:src="@{${photo}}" alt="대표 사진 미리보기">
        <span class="tag position-absolute" style="top:.6rem;left:.6rem" id="photo-label" th:text="${hasImage} ? '현재 사진' : '테마 기본 사진'">사진</span>
      </div>
      <input type="file" name="image" id="id_image" accept="image/jpeg,image/png,image/webp"
             th:class="|form-control ${errors.get('image') != null ? 'is-invalid' : ''}|">
      <div th:if="${hasImage}" class="form-check mt-2">
        <input class="form-check-input" type="checkbox" name="image-clear" id="image-clear">
        <label class="form-check-label small" for="image-clear">사진 삭제 (테마 기본 사진 사용)</label>
      </div>
      <div th:if="${errors.get('image') != null}" class="invalid-feedback d-block" th:text="${errors.get('image')}">오류</div>
      <div class="form-text">JPG·PNG, 5MB 이하. 올리지 않으면 테마 기본 사진을 씁니다.</div>
    </div>

    <!--/* 기본 구성 (UC6 (3)) */-->
    <div class="mwt-card mwt-card-soft">
      <div class="mwt-card-body">
        <div class="small fw-bold mb-2"><i class="bi bi-magic me-1"></i>기본 서비스 구성 <span class="text-muted fw-normal">테마·등급 기본값을 확인한 뒤 필요하면 바꾸세요</span></div>
        <dl class="info-list small mb-2" id="config-preview">
          <dt>테마 서비스</dt><dd data-k="themeService">-</dd>
          <dt>기념품</dt><dd data-k="souvenir">-</dd>
        </dl>
        <div class="row g-2" id="base-config">
          <div class="col-12">
            <label class="form-label small mb-1" for="id_hotel_level">기본 호텔</label>
            <select name="hotelLevel" id="id_hotel_level" th:attr="data-current=${form.hotelLevel}"
                    th:class="|form-select form-select-sm ${errors.get('hotel_level') != null ? 'is-invalid' : ''}|" disabled>
              <option value="">테마·등급을 먼저 고르세요</option>
            </select>
            <div th:if="${errors.get('hotel_level') != null}" class="invalid-feedback d-block" th:text="${errors.get('hotel_level')}">오류</div>
          </div>
          <div class="col-12">
            <label class="form-label small mb-1" for="id_meal">기본 식사</label>
            <select name="meal" id="id_meal" th:attr="data-current=${form.meal}"
                    th:class="|form-select form-select-sm ${errors.get('meal') != null ? 'is-invalid' : ''}|" disabled>
              <option value="">테마·등급을 먼저 고르세요</option>
            </select>
            <div th:if="${errors.get('meal') != null}" class="invalid-feedback d-block" th:text="${errors.get('meal')}">오류</div>
          </div>
          <div class="col-12">
            <label class="form-label small mb-1" for="id_transport">기본 교통</label>
            <select name="transport" id="id_transport" th:attr="data-current=${form.transport}"
                    th:class="|form-select form-select-sm ${errors.get('transport') != null ? 'is-invalid' : ''}|" disabled>
              <option value="">테마·등급을 먼저 고르세요</option>
            </select>
            <div th:if="${errors.get('transport') != null}" class="invalid-feedback d-block" th:text="${errors.get('transport')}">오류</div>
          </div>
        </div>
        <div class="form-text">호텔·식사는 등급 기본값 이상, 교통은 테마에서 쓸 수 있는 것만 고를 수 있습니다.</div>
        <div class="small text-danger mt-2" id="config-error" hidden></div>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
(() => {
  const DEFAULT_CONFIG_URL = /*[[@{/travel/staff/default-configuration/}]]*/ "";
  const theme = document.getElementById("id_theme");
  const level = document.getElementById("id_tour_level");
  const cells = document.querySelectorAll("#config-preview [data-k]");
  const err = document.getElementById("config-error");
  const selects = ["hotel_level", "meal", "transport"].map(k => document.getElementById("id_" + k));
  let firstLoad = true;   // 처음엔 저장·입력값 유지, 테마·등급을 바꾸면 기본값으로

  function resetSelects(text) {
    selects.forEach(s => { s.innerHTML = ""; s.add(new Option(text, "")); s.disabled = true; });
  }

  function fillSelects(choices) {
    selects.forEach(s => {
      const key = s.id.replace("id_", "");
      const keep = firstLoad ? s.dataset.current : "";
      s.innerHTML = "";
      choices[key].forEach(([value, label], i) => s.add(new Option(i === 0 ? label + " (기본)" : label, value)));
      s.value = choices[key].some(([v]) => v === keep) ? keep : choices[key][0][0];
      s.disabled = false;
    });
  }
  const RESTRICTED = ["HONEYMOON", "FILIAL"];   // 초기 등급 그랜드·프리미엄만
  let seq = 0;

  function restrictLevels() {
    const classic = level.querySelector('option[value="CLASSIC"]');
    const restricted = RESTRICTED.includes(theme.value);
    classic.disabled = restricted;
    classic.textContent = restricted ? "클래식 (이 테마는 선택 불가)" : "클래식";
    if (restricted && level.value === "CLASSIC") level.value = "";
  }

  async function loadConfig() {
    const my = ++seq;
    cells.forEach(c => c.textContent = "-");
    err.hidden = true;
    if (!theme.value || !level.value) { resetSelects("테마·등급을 먼저 고르세요"); return; }
    resetSelects("불러오는 중…");
    try {
      const q = new URLSearchParams({ theme: theme.value, tour_level: level.value });
      const res = await fetch(DEFAULT_CONFIG_URL + "?" + q);
      const data = await res.json();
      if (my !== seq) return;                    // 더 최근 요청이 있으면 버림
      if (!data.ok) throw new Error(data.message);
      cells.forEach(c => c.textContent = data.configuration[c.dataset.k]);
      fillSelects(data.configuration.choices);
      firstLoad = false;
    } catch (e) {
      if (my !== seq) return;
      // 선택 상자를 비운 채(=서버가 기본값 적용) 두고 안내한다
      resetSelects("기본값 사용");
      err.textContent = "기본 구성을 불러오지 못했습니다. 이대로 저장하면 테마·등급 기본값으로 저장됩니다.";
      err.hidden = false;
    }
  }

  // 사진 미리보기
  const file = document.getElementById("id_image");
  const preview = document.getElementById("photo-preview");
  const label = document.getElementById("photo-label");
  const original = preview.src;
  file.addEventListener("change", () => {
    const f = file.files[0];
    if (!f) { preview.src = original; return; }
    if (f.size > 5 * 1024 * 1024) {
      file.value = ""; preview.src = original;
      label.textContent = "5MB를 넘는 파일은 올릴 수 없습니다";
      return;
    }
    preview.src = URL.createObjectURL(f);
    label.textContent = "새 사진 (저장 전)";
  });

  theme.addEventListener("change", () => { restrictLevels(); loadConfig(); });
  level.addEventListener("change", loadConfig);
  restrictLevels();
  loadConfig();
})();
</script>
</th:block>
