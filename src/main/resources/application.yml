# 개발 PC 기본 설정. 배포 서버는 --spring.profiles.active=prod (application-prod.yml).
# 비밀값은 저장소 루트의 .env 에만 둔다 (KEY=VALUE 형식).
spring:
  application:
    name: mwt
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    # 개발 PC: H2 파일 DB (data/). PostgreSQL 문법 흉내 모드
    url: jdbc:h2:file:./data/mwt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 표는 Flyway(db/migration)로만 만든다
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 6MB      # 상품 사진은 5MB 이하 (넘으면 화면에서 안내)
      max-request-size: 8MB
  web:
    resources:
      cache:
        period: 0

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 14d   # Django 기본 세션 기간(2주)과 같게

mwt:
  staff-signup-code: ${STAFF_SIGNUP_CODE:MWT-STAFF-2026}
  # 문자: SMS_CLIENT 는 Console(기본, 로그만) / FlakyDemo / Solapi
  sms:
    client: ${SMS_CLIENT:Console}
    solapi-api-key: ${SOLAPI_API_KEY:}
    solapi-api-secret: ${SOLAPI_API_SECRET:}
    solapi-sender: ${SOLAPI_SENDER:}
    timeout: ${SMS_TIMEOUT:10}                     # 외부 호출 1회 대기 (초)
    batch-time-limit: ${SMS_BATCH_TIME_LIMIT:40}   # 신청 1건의 문자 묶음 전체 한도 (초)
    allowed-numbers: ${SMS_ALLOWED_NUMBERS:}       # 쉼표 구분. 있으면 이 번호로만 실제 발송
