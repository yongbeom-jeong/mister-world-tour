<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::#page-head}, ~{::#main}, ~{})}">
<head><title>내 신청 | 미스터 월드 투어</title></head>
<body>
<section id="page-head" class="mwt-page-head">
  <div class="container">
    <h1>내 여행 신청</h1>
    <p>신청한 여행과 출발 확정 여부를 확인하세요.</p>
  </div>
</section>
<div id="main" class="container pb-4">
  <div th:if="${!applications.isEmpty()}" class="row g-3">
    <div th:each="row : ${applications}" class="col-lg-6" th:with="a=${row.application}">
      <a class="app-card" th:href="@{/travel/applications/{id}/(id=${a.applicationId})}">
        <img th:src="@{${a.product.photoSmUrl}}" alt="">
        <div class="flex-grow-1">
          <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
            <span class="fw-bold" th:text="${a.product.productName}">상품</span>
            <span th:if="${a.cancelled}" class="tag tag-muted flex-shrink-0">취소함</span>
            <span th:if="${!a.cancelled and a.currentDepartureStatus() != null and a.currentDepartureStatus().name() == 'CONFIRMED'}" class="tag tag-success flex-shrink-0">출발 확정</span>
            <span th:if="${!a.cancelled and (a.currentDepartureStatus() == null or a.currentDepartureStatus().name() != 'CONFIRMED')}" class="tag tag-muted flex-shrink-0">출발 미확정</span>
          </div>
          <div class="small text-muted mb-1" th:text="|${@mwt.date(a.product.departureDate, 'yyyy년 M월 d일')} 출발 · 여행자 ${row.travelerCount}명|">출발</div>
          <div class="fw-bold" th:text="${@mwt.won(a.finalAmount)}">0원</div>
        </div>
      </a>
    </div>
  </div>
  <div th:if="${applications.isEmpty()}" class="empty-state">
    <i class="bi bi-suitcase2" aria-hidden="true"></i>
    <p class="mt-2 text-muted">아직 신청한 여행이 없습니다.</p>
    <a class="btn btn-primary" th:href="@{/travel/products/}">여행 상품 보러 가기</a>
  </div>
</div>
</body>
</html>
