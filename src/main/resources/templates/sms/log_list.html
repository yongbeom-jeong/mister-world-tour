<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::#page-head}, ~{::#main}, ~{})}">
<head><title>문자 발송 기록 | 미스터 월드 투어</title></head>
<body>
<section id="page-head" class="mwt-page-head">
  <div class="container">
    <h1>문자 발송 기록</h1>
    <p>출발 확정 문자의 발송 결과입니다. 실패하거나 결과를 알 수 없는 문자는 다시 보낼 수 있습니다.</p>
  </div>
</section>
<div id="main" class="container pb-4">
  <div class="d-flex gap-2 mb-3">
    <a th:class="|btn btn-sm ${problemsOnly ? 'btn-outline-primary' : 'btn-primary'}|" th:href="@{/sms/staff/logs/}">전체</a>
    <a th:class="|btn btn-sm ${problemsOnly ? 'btn-primary' : 'btn-outline-primary'}|" th:href="@{/sms/staff/logs/(filter='problems')}">
      확인 필요 <span th:class="|badge text-bg-${problemCount > 0 ? 'danger' : 'secondary'} ms-1|" th:text="${problemCount}">0</span></a>
  </div>

  <div class="mwt-card">
    <div class="mwt-card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0 small" id="sms-log-table">
          <thead><tr><th>요청 시각</th><th>수신자</th><th>상품</th><th>상태</th><th class="text-end">시도</th><th>내용</th><th></th></tr></thead>
          <tbody>
            <tr th:each="log : ${page.content}">
              <td class="text-nowrap" th:text="${@mwt.date(log.createdAt, 'MM-dd HH:mm')}">시각</td>
              <td class="text-nowrap"><th:block th:text="${log.recipientName}">수신자</th:block><div class="text-muted" th:text="${#strings.isEmpty(log.contact)} ? '연락처 없음' : ${log.contact}">연락처</div></td>
              <td th:text="${log.productName}">상품</td>
              <td class="text-nowrap">
                <span th:if="${log.status.name() == 'SUCCESS'}" class="tag tag-success">성공</span>
                <span th:if="${log.stalePending}" class="tag tag-warning">발송 확인 필요</span>
                <span th:if="${log.status.name() == 'PENDING' and !log.stalePending}" class="tag tag-muted">발송 중</span>
                <span th:if="${log.status.name() == 'UNKNOWN'}" class="tag tag-warning">결과 확인 필요</span>
                <span th:if="${log.status.name() == 'FAILED' or log.status.name() == 'INVALID'}" class="tag tag-danger" th:text="${log.status.label}">실패</span>
              </td>
              <td class="text-end"><th:block th:text="|${log.attemptCount}회|">0회</th:block><div th:if="${log.resendCount > 0}" class="text-muted" th:text="|재발송 ${log.resendCount}|">재발송</div></td>
              <td style="min-width:14rem">
                <div th:text="${log.message}">내용</div>
                <div th:if="${!#strings.isEmpty(log.lastError) and log.status.name() != 'SUCCESS'}" class="text-danger" th:text="${log.lastError}">오류</div>
                <div th:if="${!#strings.isEmpty(log.serviceRequestId)}" class="text-muted" th:text="|접수 번호 ${log.serviceRequestId}|">접수 번호</div>
                <div th:if="${log.resentById != null}" class="text-muted" th:text="|마지막 재발송 ${resentBy.get(log.resentById) ?: '직원'} · ${@mwt.date(log.updatedAt, 'MM-dd HH:mm')}|">재발송</div>
              </td>
              <td class="text-end text-nowrap">
                <form th:if="${log.needsAttention and !#strings.isEmpty(log.contact)}" method="post"
                      th:action="@{/sms/staff/logs/{id}/resend/(id=${log.id})}" class="d-inline-flex flex-column align-items-end gap-1" novalidate>
                  <input type="hidden" name="next" th:value="${currentPath}">
                  <label th:if="${log.mayBeDelivered}" class="form-check-label text-muted"><input type="checkbox" class="form-check-input me-1" name="confirm_duplicate" value="1" required>이미 받았을 수 있음 확인</label>
                  <button class="btn btn-sm btn-outline-primary"><i class="bi bi-arrow-repeat me-1"></i>다시 보내기</button>
                </form>
              </td>
            </tr>
            <tr th:if="${page.content.isEmpty()}"><td colspan="7" class="text-center text-muted py-5" th:text="${problemsOnly} ? '확인이 필요한 문자가 없습니다.' : '발송 기록이 없습니다.'">없음</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <nav th:if="${page.totalPages > 1}" class="mt-3" aria-label="페이지">
    <ul class="pagination pagination-sm justify-content-center">
      <li th:if="${pageNumber > 1}" class="page-item"><a class="page-link" th:href="@{/sms/staff/logs/(filter=${problemsOnly ? 'problems' : null},page=${pageNumber - 1})}">이전</a></li>
      <li class="page-item disabled"><span class="page-link" th:text="|${pageNumber} / ${page.totalPages}|">1 / 1</span></li>
      <li th:if="${pageNumber < page.totalPages}" class="page-item"><a class="page-link" th:href="@{/sms/staff/logs/(filter=${problemsOnly ? 'problems' : null},page=${pageNumber + 1})}">다음</a></li>
    </ul>
  </nav>
</div>
</body>
</html>
