<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{}, ~{::#main}, ~{::#scripts})}">
<head><title>회원가입 | 미스터 월드 투어</title></head>
<body>
<div id="main" class="auth-wrap">
  <div class="auth-card wide">
    <div>
      <h1>회원가입</h1>
      <p class="text-muted mb-4">성명·주소·연락처는 여행 신청과 출발 확정 문자에 사용됩니다. 최근 3년 동안 3번 이상 함께한 고객님께는 10% 단골 할인을 드립니다.</p>
      <form method="post" th:action="@{/members/signup/}" th:object="${form}" novalidate>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:text="${#strings.listJoin(#fields.globalErrors(), ' ')}">오류</div>
        <div class="mb-3">
          <div class="form-label">회원 유형 <span class="text-danger">*</span></div>
          <div class="chip-group">
            <th:block th:each="r : ${roles}">
              <input type="radio" class="btn-check" name="memberType" th:id="|id_memberType_${r.name()}|"
                     th:value="${r.name()}" th:checked="*{memberType} == ${r.name()}">
              <label class="btn" th:for="|id_memberType_${r.name()}|"><i th:class="|bi ${r.name() == 'STAFF' ? 'bi-briefcase' : 'bi-person'} me-1|"></i><th:block th:text="${r.label}">고객</th:block></label>
            </th:block>
          </div>
          <div th:each="e : ${#fields.errors('memberType')}" class="invalid-feedback d-block" th:text="${e}">오류</div>
        </div>
        <div th:replace="~{fragments/field :: field('username', '아이디', 'text', true, '영문·숫자·밑줄 4~20자')}"></div>
        <div class="row g-2">
          <div class="col-sm-6"><div th:replace="~{fragments/field :: field('password1', '비밀번호', 'password', true, '8자 이상. 숫자로만 된 비밀번호, 흔한 비밀번호(password123 등), 아이디·성명과 비슷한 비밀번호는 쓸 수 없습니다.')}"></div></div>
          <div class="col-sm-6"><div th:replace="~{fragments/field :: field('password2', '비밀번호 확인', 'password', true, null)}"></div></div>
        </div>
        <div class="row g-2">
          <div class="col-sm-5"><div th:replace="~{fragments/field :: field('name', '성명', 'text', true, null)}"></div></div>
          <div class="col-sm-7"><div th:replace="~{fragments/field :: field('contact', '연락처', 'text', true, '예: 010-1234-5678 (출발 확정 문자를 받을 번호)')}"></div></div>
        </div>
        <div th:replace="~{fragments/field :: field('address', '주소', 'text', true, null)}"></div>
        <div id="staff-code-box">
          <div th:replace="~{fragments/field :: field('staffCode', '직원 인증 코드', 'password', false, '직원 유형으로 가입할 때만 입력')}"></div>
        </div>
        <button class="btn btn-primary btn-lg w-100 mt-2">가입하기</button>
      </form>
      <p class="text-center mt-4 mb-0 small">이미 계정이 있나요? <a th:href="@{/members/login/}" class="fw-semibold">로그인</a></p>
    </div>
  </div>
</div>
<script id="scripts">
  // 직원 유형을 골랐을 때만 직원 인증 코드 입력란을 보인다.
  const box = document.getElementById("staff-code-box");
  const radios = document.querySelectorAll('input[name="memberType"]');
  function syncStaff() {
    const checked = document.querySelector('input[name="memberType"]:checked');
    box.style.display = checked && checked.value === "STAFF" ? "" : "none";
  }
  radios.forEach(r => r.addEventListener("change", syncStaff));
  syncStaff();

  // 입력하는 동안 형식 안내를 바로 보여준다. 최종 검사는 서버가 한다.
  function liveHint(input, check) {
    const hint = document.createElement("div");
    hint.className = "small mt-1";
    input.closest(".mb-3").appendChild(hint);
    const update = () => {
      if (!input.value) { hint.textContent = ""; return; }
      const [ok, msg] = check(input.value);
      hint.textContent = (ok ? "✓ " : "✗ ") + msg;
      hint.className = "small mt-1 " + (ok ? "text-success" : "text-danger");
    };
    input.addEventListener("input", update);
    return update;
  }

  const pw1 = document.getElementById("id_password1");
  const pw2 = document.getElementById("id_password2");
  liveHint(document.getElementById("id_username"), v =>
    /^[A-Za-z0-9_]{4,20}$/.test(v) ? [true, "사용할 수 있는 형식입니다 (중복 여부는 가입 시 확인)"]
                                   : [false, "영문·숫자·밑줄(_) 4~20자로 입력해 주세요"]);
  liveHint(pw1, v =>
    v.length < 8 ? [false, `8자 이상 입력해 주세요 (현재 ${v.length}자)`]
    : /^\d+$/.test(v) ? [false, "숫자로만 된 비밀번호는 쓸 수 없습니다"]
    : [true, "길이·형식 조건을 만족합니다"]);
  const updatePw2 = liveHint(pw2, v =>
    v === pw1.value ? [true, "비밀번호가 일치합니다"] : [false, "비밀번호가 일치하지 않습니다"]);
  pw1.addEventListener("input", updatePw2);
  liveHint(document.getElementById("id_contact"), v =>
    /^01[016789]-?\d{3,4}-?\d{4}$/.test(v.trim()) ? [true, "올바른 휴대전화 번호 형식입니다"]
                                                   : [false, "예: 010-1234-5678"]);
</script>
</body>
</html>
