<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::#page-head}, ~{::#main}, ~{})}">
<head><title>기념품 차감 내역 | 미스터 월드 투어</title></head>
<body>
<section id="page-head" class="mwt-page-head">
  <div class="container">
    <a th:href="@{/souvenir/staff/souvenirs/}" class="mwt-back"><i class="bi bi-chevron-left" aria-hidden="true"></i>기념품 관리</a>
    <h1>기념품 차감 내역</h1>
    <p>출발 확정으로 재고에서 차감한 기록입니다. 품목마다 여행자 1인당 1개씩 차감됩니다.</p>
  </div>
</section>
<div id="main" class="container pb-4">
  <form method="get" class="d-flex gap-2 align-items-center mb-3">
    <label class="small text-muted text-nowrap" for="filter_souvenir">품목</label>
    <select name="souvenir" id="filter_souvenir" class="form-select form-select-sm" style="max-width:18rem">
      <option value="">전체</option>
      <option th:each="s : ${souvenirs}" th:value="${s.id}" th:selected="${selected != null and selected == s.id}"
              th:text="|${s.name} (${s.theme.label})${s.active ? '' : ' · 삭제됨'}|">품목</option>
    </select>
    <button class="btn btn-sm btn-outline-primary text-nowrap">보기</button>
  </form>
  <div class="mwt-card">
    <div class="mwt-card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0 small" id="issue-table">
          <thead><tr><th>차감 시각</th><th>품목</th><th>상품</th><th>신청</th><th class="text-end">차감</th><th class="text-end">차감 후 재고</th></tr></thead>
          <tbody>
            <tr th:each="r : ${rows}" th:with="i=${r.issue}">
              <td class="text-nowrap" th:text="${@mwt.date(i.issuedAt, 'yyyy-MM-dd HH:mm')}">시각</td>
              <td><th:block th:text="${i.souvenir.name}">품목</th:block><span th:unless="${i.souvenir.active}" class="text-muted"> (삭제됨)</span></td>
              <td><th:block th:text="${r.application != null} ? ${r.application.productName} : '-'">상품</th:block>
                <div th:if="${r.application != null}" class="text-muted" th:text="|${@mwt.date(r.application.departureDate, 'yyyy-MM-dd')} 출발|">출발</div></td>
              <td class="text-nowrap" th:text="|#${i.applicationId} ${r.memberName}|">신청</td>
              <td class="text-end" th:text="|−${i.quantity}개|">0개</td>
              <td class="text-end" th:text="|${i.stockAfter}개|">0개</td>
            </tr>
            <tr th:if="${rows.isEmpty()}"><td colspan="6" class="text-center text-muted py-5">차감 내역이 없습니다.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <nav th:if="${page.totalPages > 1}" class="mt-3" aria-label="페이지">
    <ul class="pagination pagination-sm justify-content-center">
      <li th:if="${pageNumber > 1}" class="page-item"><a class="page-link" th:href="@{/souvenir/staff/souvenirs/issues/(souvenir=${selected},page=${pageNumber - 1})}">이전</a></li>
      <li class="page-item disabled"><span class="page-link" th:text="|${pageNumber} / ${page.totalPages}|">1 / 1</span></li>
      <li th:if="${pageNumber < page.totalPages}" class="page-item"><a class="page-link" th:href="@{/souvenir/staff/souvenirs/issues/(souvenir=${selected},page=${pageNumber + 1})}">다음</a></li>
    </ul>
  </nav>
</div>
</body>
</html>
