<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::#page-head}, ~{::#main}, ~{})}">
<head><title th:text="${product.name} + ' | 미스터 월드 투어'">상품 | 미스터 월드 투어</title></head>
<body>
<section id="page-head" class="detail-title">
  <div class="container">
    <a th:href="@{/travel/products/(theme=${product.theme.name()})}" class="mwt-back"><i class="bi bi-chevron-left" aria-hidden="true"></i><th:block th:text="|${product.theme.shortLabel} 상품 목록|">상품 목록</th:block></a>
    <h1 th:text="${product.name}">상품</h1>
    <div class="meta">
      <span th:if="${product.confirmed}" class="tag tag-success"><i class="bi bi-check2" aria-hidden="true"></i>출발 확정</span>
      <span><i th:class="|bi ${@mwt.theme(product.theme).icon}|" aria-hidden="true"></i> <th:block th:text="|${product.theme.shortLabel} · ${product.tourLevel.label}|">테마</th:block></span>
      <span class="text-muted">·</span>
      <span th:text="${product.destination}">여행지</span>
      <span class="text-muted">·</span>
      <span th:text="|${@mwt.date(product.departureDate, 'yyyy년 M월 d일')} 출발 · ${product.travelDays}일|">출발</span>
    </div>
  </div>
</section>

<div id="main" class="container pb-4">
  <div class="detail-photo"><img th:src="@{${product.photoUrl}}" th:alt="|${product.name} 대표 사진|"></div>

  <div class="row g-4 g-lg-5">
    <div class="col-lg-7">
      <!--/* ---------------------------------------------------------------- 상품 소개 */-->
      <section class="detail-section">
        <h2>여행 소개</h2>
        <p class="mb-0" style="white-space: pre-line" th:text="${#strings.isEmpty(product.description)} ? '상품 소개가 준비 중입니다.' : ${product.description}">소개</p>
      </section>

      <section class="detail-section">
        <h2>기본으로 포함된 것</h2>
        <ul class="feature-list">
          <li><i class="bi bi-stars" aria-hidden="true"></i><div><div class="f-label">테마 서비스</div><div class="f-value" th:text="${product.themeService}">서비스</div></div></li>
          <!--/* TODO(기념품 이식 때): 테마 기념품 이름 (1인 1개씩) */-->
          <li><i class="bi bi-building" aria-hidden="true"></i><div><div class="f-label">기본 호텔</div><div class="f-value" th:text="${product.hotelLevel.label}">호텔</div></div></li>
          <li><i class="bi bi-cup-hot" aria-hidden="true"></i><div><div class="f-label">기본 식사</div><div class="f-value" th:text="${product.meal.label}">식사</div></div></li>
          <li><i class="bi bi-car-front" aria-hidden="true"></i><div><div class="f-label">교통</div><div class="f-value" th:text="${product.transport.label}">교통</div></div></li>
          <li><i class="bi bi-people" aria-hidden="true"></i><div><div class="f-label">모집</div><div class="f-value">
            <th:block th:if="${product.honeymoon}">2인 신청마다 바로 출발 확정</th:block>
            <th:block th:unless="${product.honeymoon}">정원 10명 · 3명 이상 출발<div class="small fw-normal text-muted" th:text="|남은 자리 ${remaining}명|">남은 자리</div></th:block>
          </div></div></li>
        </ul>
      </section>
      <!--/* TODO(구성·신청 이식 때): 나만의 여행 구성 (호텔·교통·식사·음료) */-->
    </div>

    <!--/* ---------------------------------------------------------------- 가격·신청 (PC: 오른쪽 카드, 휴대폰: 하단 바) */-->
    <div class="col-lg-5 col-xl-4 offset-xl-1">
      <aside class="booking-bar" aria-label="선택한 여행 가격과 신청">
        <div class="booking-bar-product">
          <div class="fw-bold" th:text="${product.name}">상품</div>
          <div class="small text-muted" th:text="|${@mwt.date(product.departureDate, 'M월 d일')} 출발 · ${product.travelDays}일 · 기본 ${@mwt.won(product.basePrice)}|">조건</div>
        </div>
        <div class="booking-bar-price">
          <div class="price-big"><span id="unit-price" th:text="${@mwt.number(product.basePrice)}">0</span>원 <span class="fs-6 fw-normal text-muted">/ 1인</span></div>
          <div class="booking-note">옵션 포함, 단골 할인 적용 전</div>
        </div>
      </aside>
    </div>
  </div>
</div>
</body>
</html>
