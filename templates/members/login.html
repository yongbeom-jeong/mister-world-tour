{% extends "base.html" %}
{% block title %}로그인 | 미스터 월드 투어{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">로그인</h2>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}<div class="alert alert-danger">아이디 또는 비밀번호가 올바르지 않습니다.</div>{% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">아이디</label>
        <input class="form-control" type="text" name="username" id="id_username"
               value="{{ form.username.value|default:'' }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">비밀번호</label>
        <input class="form-control" type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">로그인</button>
    </form>
    <p class="text-center mt-3 small">계정이 없나요? <a href="{% url 'members:signup' %}">회원가입</a></p>
  </div>
</div>
{% endblock %}
