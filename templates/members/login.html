{% extends "base.html" %}
{% load mwt %}
{% block title %}로그인 | 미스터 월드 투어{% endblock %}
{% block full_width %}
<div class="auth-wrap">
  <div class="auth-card">
    <div>
      <h1>로그인</h1>
      <p class="text-muted mb-4">다시 만나 반가워요. 고객·직원 모두 같은 화면에서 로그인합니다.</p>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger"><i class="bi bi-exclamation-octagon-fill me-1"></i>아이디 또는 비밀번호가 올바르지 않습니다.</div>{% endif %}
        <div class="mb-3">
          <label class="form-label" for="id_username">아이디</label>
          <input class="form-control form-control-lg" type="text" name="username" id="id_username"
                 value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">비밀번호</label>
          <input class="form-control form-control-lg" type="password" name="password" id="id_password" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary btn-lg w-100">로그인</button>
      </form>
      <p class="text-center mt-4 mb-0 small">계정이 없나요? <a href="{% url 'members:signup' %}" class="fw-semibold">회원가입</a></p>
    </div>
  </div>
</div>
{% endblock %}
