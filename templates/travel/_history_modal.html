{% comment %}
  고객 이전 여행 이력 팝업 (UC3). base.html 에서 고객에게만 포함한다.
  로그인 직후 처음 보는 화면(홈이든 로그인 전 보던 화면이든)에서 한 번 자동으로 열고,
  data-history-open 이 붙은 버튼으로 다시 열 수 있다.
{% endcomment %}
<div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="historyModalLabel">이전 여행 이력</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body" id="historyBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-primary" id="historyRetry" hidden>다시 시도</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const modal = new bootstrap.Modal(document.getElementById("historyModal"));
  const body = document.getElementById("historyBody");
  const retry = document.getElementById("historyRetry");

  async function loadHistory() {
    retry.hidden = true;
    body.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-secondary" role="status"></div></div>';
    try {
      const res = await fetch("{% url 'travel:history' %}", { headers: { "X-Requested-With": "fetch" } });
      body.innerHTML = await res.text();
      retry.hidden = res.ok;
    } catch (e) {
      // 이전 결과를 남기지 않고 실패를 표시한다 (빈 이력과 구분)
      body.innerHTML = '<div class="alert alert-danger mb-0">여행 이력을 불러오지 못했습니다. 네트워크를 확인해 주세요.</div>';
      retry.hidden = false;
    }
  }

  function openHistory() { modal.show(); loadHistory(); }
  document.querySelectorAll("[data-history-open]").forEach(b => b.addEventListener("click", openHistory));
  retry.addEventListener("click", loadHistory);
  {% if show_history_popup %}openHistory();{% endif %}
})();
</script>
