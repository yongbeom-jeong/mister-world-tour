{% extends "base.html" %}
{% block title %}상품 등록 | 미스터 월드 투어{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">상품 등록</h2>
  <a class="btn btn-outline-secondary btn-sm" href="{% url 'travel:product_manage' %}">상품 관리로</a>
</div>
<p class="text-muted">기획한 새 여행 상품을 입력합니다. 기존 상품의 수정·삭제는 <a href="{% url 'travel:product_manage' %}">상품 관리</a>에서 합니다.</p>
<form method="post" novalidate class="col-lg-9">
  {% csrf_token %}
  {% include "travel/staff/_product_form.html" %}
  <button class="btn btn-primary">등록</button>
</form>
{% endblock %}
